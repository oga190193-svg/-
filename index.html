<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشويات رجب راشد | منيو وطلب أونلاين</title>
<meta name="description" content="مشويات رجب راشد - جميع اللحوم بلدي 100%. كفتة، سجق، طرب، ريش ضاني، وجبات وصواني. اطلب الآن عبر واتساب.">
<meta name="theme-color" content="#120c0a">
<meta property="og:title" content="مشويات رجب راشد">
<meta property="og:description" content="طعم يثبت في القلب - جميع اللحوم بلدي 100%">
<meta property="og:image" content="hero.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c0a;--card:#1d1411;--card2:#261a16;--line:#3a2a24;--red:#b3201f;--red2:#8e1514;--or:#ff8a2a;--or2:#ffb347;--tx:#f6ede6;--mut:#b8a79b;--ok:#25d366;--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:128px;scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;padding-bottom:96px}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hero{position:relative;text-align:center;padding:44px 18px 34px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url(hero.jpg) center/cover;opacity:.2}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--bg))}
.hero>*{position:relative;z-index:1}
.flame{font-size:46px;filter:drop-shadow(0 0 14px #ff6a00aa)}
.hero h1{font-size:clamp(34px,9vw,58px);font-weight:900;line-height:1.2}
.hero h1 span{background:linear-gradient(90deg,var(--or),var(--or2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-block;margin-top:10px;background:var(--red);padding:4px 18px;border-radius:6px;font-weight:700;font-size:15px;box-shadow:0 4px 18px #b3201f66}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.badge{background:#ffffff10;border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:13px;color:var(--or2);font-weight:600}
.qactions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.qbtn{background:#ffffff14;border:1px solid var(--or);color:var(--or2);padding:7px 14px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:.2s}
.qbtn:active{transform:scale(.96);background:var(--or);color:#000}
.sticky{position:sticky;top:0;z-index:30;background:#120c0af7;border-bottom:1px solid var(--line);padding:10px 12px 8px;padding-top:calc(10px + env(safe-area-inset-top))}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;max-width:760px;margin:0 auto 8px}
.search input{flex:1;background:none;border:0;outline:0;padding:10px 0;font-size:15px}
.chips{overscroll-behavior-x:contain;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:900px;margin:0 auto;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:6px 16px;border-radius:99px;font-size:14px;font-weight:600;transition:.2s}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:900px;margin:0 auto;padding:6px 14px}
.sec{margin-top:26px}
.sec h2{font-size:24px;font-weight:900;margin-bottom:12px;color:var(--or2);display:flex;align-items:center;gap:8px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.item h3{font-size:17px;font-weight:700}
.item p{font-size:13px;color:var(--mut);flex:1}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.price{font-weight:900;color:var(--or);font-size:18px}
.price small{font-size:12px;color:var(--mut);font-weight:600}
.add{background:var(--red);color:#fff;border-radius:10px;padding:6px 16px;font-weight:700;font-size:14px;transition:.15s}
.add:active{transform:scale(.94);background:var(--red2)}
.qty{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:2px 4px}
.qty button{width:30px;height:30px;border-radius:8px;font-size:18px;font-weight:900;color:var(--or2)}
.qty b{min-width:20px;text-align:center}
.empty{text-align:center;color:var(--mut);padding:40px 0;display:none}
.bar{position:fixed;inset:auto 0 0 0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#120c0a 40%);transform:translateY(120%);transition:transform .3s}
.bar.show{transform:none}
.bar button{width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--ok);color:#06210f;font-weight:900;font-size:16px;padding:13px 18px;border-radius:16px;box-shadow:0 8px 26px #25d36655}
.sheet{position:fixed;inset:0;z-index:60;background:#000b;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.panel h2{font-size:21px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.close{font-size:22px;color:var(--mut)}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.line span:first-child{flex:1}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin:12px 0}
.total b{color:var(--or)}
.panel input,.panel textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:15px;outline:0}
.panel input:focus,.panel textarea:focus,.chip:focus-visible,.add:focus-visible,.qbtn:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.send{width:100%;background:var(--ok);color:#06210f;font-weight:900;font-size:16px;padding:13px;border-radius:14px;margin-top:4px}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 14px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="flame">🔥</div>
  <h1>مشويات <span>رجب راشد</span></h1>
  <div class="tag">طعم يثبت في القلب</div>
  <div class="badges">
    <span class="badge">🥩 جميع اللحوم بلدي 100%</span>
    <span class="badge">🔥 على الفحم</span>
    <span class="badge">🚚 توصيل</span>
  </div>
  <div class="qactions">
    <a class="qbtn" id="callBtn" href="tel:+201000000000">📞 اتصل بنا</a>
    <a class="qbtn" id="waBtn" href="https://wa.me/201000000000" target="_blank" rel="noopener">💬 واتساب</a>
  </div>
</header>

<div class="sticky">
  <div class="search">🔍<input id="q" type="search" placeholder="ابحث في المنيو..." aria-label="بحث"></div>
  <nav class="chips" id="chips" aria-label="الأقسام"></nav>
</div>

<main id="menu"></main>
<div class="empty" id="empty">مفيش نتائج للبحث ده. جرّب كلمة تانية.</div>
<footer>© مشويات رجب راشد — الأسعار قابلة للتغيير</footer>

<div class="bar" id="bar"><button id="openCart"><span>🛒 <span id="cnt">0</span> أصناف</span><span>عرض الطلب · <span id="sum">0</span> ج.م</span></button></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="الطلب">
  <div class="panel">
    <h2>طلبك <button class="close" id="close" aria-label="إغلاق">✕</button></h2>
    <div id="lines"></div>
    <div class="total"><span>الإجمالي</span><b><span id="tot">0</span> ج.م</b></div>
    <input id="name" placeholder="الاسم" autocomplete="name">
    <input id="phone" type="tel" placeholder="رقم الموبايل" autocomplete="tel">
    <input id="addr" placeholder="العنوان بالتفصيل" autocomplete="street-address">
    <textarea id="notes" rows="2" placeholder="ملاحظات (اختياري)"></textarea>
    <button class="send" id="send">إرسال الطلب على واتساب</button>
    <p class="note">هيتفتح واتساب برسالة جاهزة، اضغط إرسال.</p>
  </div>
</div>

<script>
/* ===== إعدادات: غيّر الرقم (بصيغة دولية بدون +) والأسعار والأصناف ===== */
const WHATSAPP = "201000000000";
const MENU = [
  {cat:"الكفتة والسجق", items:[
    {n:"كفتة مشوية", d:"كفتة بلدي متبلة على الفحم", p:260, u:"كيلو"},
    {n:"سجق بلدي", d:"سجق بلدي مشوي بتتبيلة البيت", p:280, u:"كيلو"},
    {n:"كفتة سجق مشكل", d:"نص كفتة ونص سجق", p:270, u:"كيلو"}
  ]},
  {cat:"الطرب والريش", items:[
    {n:"طرب مشوي", d:"طرب بلدي طري", p:300, u:"كيلو"},
    {n:"ريش ضاني", d:"ريش ضاني مشوية على نار هادية", p:520, u:"كيلو"},
    {n:"كباب حلة", d:"لحم بلدي مع الشوربة", p:380, u:"كيلو"}
  ]},
  {cat:"الوجبات", items:[
    {n:"وجبة كفتة", d:"ربع كيلو كفتة + عيش + سلطة + طحينة", p:90, u:"وجبة"},
    {n:"وجبة سجق", d:"ربع كيلو سجق + عيش + سلطة", p:95, u:"وجبة"},
    {n:"وجبة ريش", d:"ريش ضاني + أرز + سلطة", p:180, u:"وجبة"}
  ]},
  {cat:"الصواني", items:[
    {n:"صينية مشاوي صغيرة", d:"تكفي 2-3 أفراد", p:480, u:"صينية"},
    {n:"صينية مشاوي كبيرة", d:"تكفي 5-6 أفراد، مشكل كامل", p:950, u:"صينية"}
  ]},
  {cat:"إضافات", items:[
    {n:"أرز بالشعرية", d:"طبق أرز", p:25, u:"طبق"},
    {n:"سلطة طحينة", d:"طبق", p:15, u:"طبق"},
    {n:"عيش بلدي", d:"ربطة", p:10, u:"ربطة"}
  ]}
];

const cart = {}; // key -> {n,p,q}
const $ = id => document.getElementById(id);
const menuEl = $("menu"), chipsEl = $("chips");
const key = (c,i) => c + "-" + i;

function render(){
  const term = $("q").value.trim();
  menuEl.innerHTML = "";
  let shown = 0;
  MENU.forEach((s,ci)=>{
    const items = s.items.map((it,ii)=>({...it,k:key(ci,ii)}))
      .filter(it => !term || (it.n + it.d + s.cat).includes(term));
    if(!items.length) return;
    shown += items.length;
    const sec = document.createElement("section");
    sec.className = "sec"; sec.id = "c" + ci;
    sec.innerHTML = `<h2>${s.cat}</h2><div class="grid">` + items.map(it=>{
      const q = cart[it.k]?.q || 0;
      return `<article class="item"><h3>${it.n}</h3><p>${it.d}</p>
        <div class="row"><span class="price">${it.p} <small>ج.م / ${it.u}</small></span>
        ${q ? `<div class="qty"><button data-k="${it.k}" data-d="-1" aria-label="إنقاص">−</button><b>${q}</b><button data-k="${it.k}" data-d="1" aria-label="زيادة">+</button></div>`
            : `<button class="add" data-k="${it.k}" data-d="1">أضف</button>`}
        </div></article>`;
    }).join("") + `</div>`;
    menuEl.appendChild(sec);
  });
  $("empty").style.display = shown ? "none" : "block";
}

chipsEl.innerHTML = MENU.map((s,i)=>`<button class="chip${i?"":" on"}" data-i="${i}">${s.cat}</button>`).join("");
chipsEl.addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  $("q").value = ""; render();
  chipsEl.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c===b));
  $("c" + b.dataset.i)?.scrollIntoView();
});

function change(k,d){
  const [ci,ii] = k.split("-").map(Number);
  const it = MENU[ci].items[ii];
  const q = Math.max(0, (cart[k]?.q || 0) + d);
  if(q) cart[k] = {n:it.n,p:it.p,u:it.u,q}; else delete cart[k];
  update(); render(); renderLines();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-k]"); if(b) change(b.dataset.k, +b.dataset.d);
});
$("q").addEventListener("input", render);

function totals(){
  let c=0,t=0; Object.values(cart).forEach(i=>{c+=i.q;t+=i.q*i.p}); return {c,t};
}
function update(){
  const {c,t} = totals();
  $("cnt").textContent = c; $("sum").textContent = t; $("tot").textContent = t;
  $("bar").classList.toggle("show", c>0);
}
function renderLines(){
  const e = Object.entries(cart);
  $("lines").innerHTML = e.length ? e.map(([k,i])=>`<div class="line"><span>${i.n}</span>
    <div class="qty"><button data-k="${k}" data-d="-1" aria-label="إنقاص">−</button><b>${i.q}</b><button data-k="${k}" data-d="1" aria-label="زيادة">+</button></div>
    <span class="price">${i.q*i.p}</span></div>`).join("") : `<p class="note">الطلب فاضي.</p>`;
  if(!e.length) $("sheet").classList.remove("open");
}

$("openCart").onclick = ()=>{ renderLines(); $("sheet").classList.add("open"); };
$("close").onclick = ()=> $("sheet").classList.remove("open");
$("sheet").addEventListener("click", e=>{ if(e.target.id==="sheet") $("sheet").classList.remove("open"); });

$("send").onclick = ()=>{
  const {t} = totals();
  const name = $("name").value.trim(), phone = $("phone").value.trim(), addr = $("addr").value.trim();
  if(!Object.keys(cart).length) return;
  if(!name || !phone || !addr){ alert("من فضلك اكتب الاسم ورقم الموبايل والعنوان."); return; }
  let m = "*طلب جديد - مشويات رجب راشد*\n\n";
  Object.values(cart).forEach(i=>{ m += `• ${i.n} × ${i.q} = ${i.q*i.p} ج.م\n`; });
  m += `\n*الإجمالي:* ${t} ج.م\n\n*الاسم:* ${name}\n*الموبايل:* ${phone}\n*العنوان:* ${addr}`;
  const notes = $("notes").value.trim(); if(notes) m += `\n*ملاحظات:* ${notes}`;
  window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(m), "_blank");
};

$("waBtn").href = "https://wa.me/" + WHATSAPP;
$("callBtn").href = "tel:+" + WHATSAPP;
render();
</script>
</body>
</html>
